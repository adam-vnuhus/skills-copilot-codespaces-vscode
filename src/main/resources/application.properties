server.port=8080
spring.application.name=signature-routing-service

# Database Configuration (H2 in-memory for demo)
spring.datasource.url=jdbc:h2:mem:routing_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# Logging Configuration
logging.level.com.vnuhus.signaturerouting=DEBUG
logging.level.org.springframework.web=INFO

# HTTP Client Configuration
spring.webflux.httpclient.connect-timeout=30000
spring.webflux.httpclient.response-timeout=60000

# External Service URLs (can be overridden by environment variables)
external-services.old-api.base-url=http://localhost:8081
external-services.new-api.base-url=http://localhost:8082